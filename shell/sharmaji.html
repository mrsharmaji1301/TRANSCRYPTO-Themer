<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TRANSCRYPTO Shell - SharmaJi Command Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --a: #ff8a00; --b: #00e5ff; --k: #ffd166; --metal: #121119; --metal2: #1d1c27; --line: #2e2d3e; }
* { box-sizing: border-box; margin: 0; }
html { background: #07060b; }
html, body { width: 100vw; height: 100vh; overflow: hidden; color: #e9ecff; font-family: Rajdhani, sans-serif; user-select: none; }
body { background: transparent; }   /* the backdrop images sit at z-index -1/-2, under the body */
.stage { position: absolute; width: 1280px; height: 720px; perspective: 1600px; }
.tcTip { position: fixed; z-index: 100; display: none; padding: 3px 9px; font: 700 11px Rajdhani; letter-spacing: .1em; color: var(--b); background: #0c0b12; border: 1px solid var(--b); white-space: nowrap; pointer-events: none; }

/* taskbar */
.rail { position: absolute; left: 50%; bottom: 0; height: 52px; transform: translateX(-50%); z-index: 15;
  background: linear-gradient(180deg, #0d0c13, #08070c); border: 1px solid #22212e;
  clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%, 0 16px); }
.rail::before { content: ""; position: absolute; left: 22px; right: 22px; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--a), var(--b), var(--a), transparent) 0 0 / 50% 100% repeat-x; animation: flow 3s linear infinite; }
.rail::after { content: ""; position: absolute; left: 30px; right: 30px; bottom: 3px; height: 1px; background: repeating-linear-gradient(90deg, var(--b) 0 6px, transparent 6px 14px); opacity: .25; }
@keyframes flow { to { background-position: 200% 0; } }
.bar { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); height: 44px; display: flex; gap: 5px; align-items: stretch; z-index: 20; }
.plate { position: relative; background: linear-gradient(180deg, var(--metal2), var(--metal)); border: 1px solid var(--line); display: grid; place-items: center;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); transition: filter .15s, transform .15s; }
.plate::after { content: ""; position: absolute; left: 8px; right: 8px; top: 0; height: 2px; background: linear-gradient(90deg, var(--a), var(--b)); opacity: .75; }
.plate .bolt { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #3a394c; box-shadow: inset 0 0 0 1px #55546c; }
.plate .bolt.r { right: 4px; top: 4px; } .plate .bolt.l { left: 4px; bottom: 4px; }
.plate.app { width: 44px; cursor: pointer; }
.plate.app img { width: 24px; height: 24px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.plate.app:hover { filter: drop-shadow(0 0 10px var(--b)); transform: translateY(-3px); }
.plate.app.run::before { content: ""; position: absolute; bottom: 4px; width: 14px; height: 3px; background: linear-gradient(90deg, var(--k), var(--a)); box-shadow: 0 0 8px var(--a); }
.plate.app.act { border-color: var(--b); box-shadow: inset 0 0 14px color-mix(in srgb, var(--b) 35%, transparent); }
.plate.app.act::before { width: 24px; background: linear-gradient(90deg, var(--b), var(--a)); box-shadow: 0 0 10px var(--b); }
.plate.start { width: 58px; cursor: pointer; overflow: visible; }
.orb { position: relative; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 900 10px Orbitron; color: var(--a);
  background: radial-gradient(circle, color-mix(in srgb, var(--a) 35%, #000) 0 40%, #0a0910 70%); box-shadow: 0 0 16px var(--b), inset 0 0 10px var(--a); border: 2px solid var(--b); }
.orb .r1, .orb .r2 { position: absolute; border-radius: 50%; pointer-events: none; }
.orb .r1 { inset: -6px; background: repeating-conic-gradient(var(--b) 0 2deg, transparent 2deg 15deg);
  -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%, #000 72%, transparent 74%); mask: radial-gradient(circle, transparent 60%, #000 62%, #000 72%, transparent 74%); animation: spin 14s linear infinite; }
.orb .r2 { inset: 3px; border: 1px dashed color-mix(in srgb, var(--a) 70%, transparent); animation: spin 6s linear infinite reverse; }
.orb.charge .r1 { animation-duration: .5s; } .orb.charge .r2 { animation-duration: .35s; }
@keyframes spin { to { transform: rotate(360deg); } }
.plate.tray { width: 124px; display: flex; gap: 10px; justify-content: center; font-size: 16px; color: #aab0d6; }
.plate.tray i { cursor: pointer; } .plate.tray i:hover { color: var(--b); }
.plate.clock { width: 96px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; font: 600 15px 'JetBrains Mono'; color: var(--b); line-height: 1.05; text-shadow: 0 0 8px color-mix(in srgb, var(--b) 60%, transparent); }
.plate.clock small { font: 500 9px 'JetBrains Mono'; color: #9aa0c8; text-shadow: none; }
.plate.clock i.tri { position: absolute; bottom: 4px; left: 24px; right: 24px; height: 2px; background: linear-gradient(90deg, #ff9933 33%, #f5f5f5 33% 66%, #13a808 66%); }
/* rail ends: a settings gear that only shows on hover (opens the Themer) and a neon red X (exit) */
.edge { width: 30px; display: grid; place-items: center; cursor: pointer; font-size: 17px; position: relative; }
.edge.gear { color: #aab0d6; opacity: 0; transition: opacity .2s, color .2s, transform .3s; }
.edge.gear:hover { opacity: 1; color: var(--b); transform: rotate(60deg); filter: drop-shadow(0 0 6px var(--b)); }
.edge.quit { color: #ff2a3d; font-size: 19px; opacity: 0; transition: opacity .2s, transform .2s; filter: drop-shadow(0 0 4px #ff2a3d) drop-shadow(0 0 10px rgba(255,42,61,.8)); animation: redglow 2.4s ease-in-out infinite; }
.edge.quit:hover { opacity: 1; color: #ff6b78; transform: scale(1.15); }
.edge.quit.armed { opacity: 1; animation: blink .4s steps(1) infinite; }
@keyframes redglow { 50% { filter: drop-shadow(0 0 2px #ff2a3d) drop-shadow(0 0 16px rgba(255,42,61,1)); } }
.beam { position: absolute; height: 3px; z-index: 25; pointer-events: none; background: linear-gradient(90deg, transparent, #fff, var(--b), transparent); box-shadow: 0 0 12px var(--b); opacity: 0; }

/* pistons */
.piston { position: absolute; width: 16px; z-index: 12; opacity: 0; display: flex; flex-direction: column-reverse; align-items: center; }
.piston i { display: block; background: linear-gradient(90deg, #2b2a38, #6d6c84 45%, #2b2a38); border: 1px solid #44435a; }
.piston i:nth-child(1) { width: 16px; height: 14px; } .piston i:nth-child(2) { width: 11px; height: 14px; } .piston i:nth-child(3) { width: 7px; height: 14px; box-shadow: 0 0 8px var(--b); }

/* start menu */
.menu { position: absolute; left: 50%; bottom: 96px; width: 780px; height: 470px; margin-left: -390px; z-index: 10; pointer-events: none; transform-style: preserve-3d; transition: transform .25s ease-out; }
.menu.live { pointer-events: auto; }
.shard { position: absolute; background: linear-gradient(160deg, #1c1b27, #0d0c14); border: 1px solid #36354c; opacity: 0; overflow: hidden; }
.shard::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); pointer-events: none; }
.shard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0 14px, color-mix(in srgb, var(--b) 40%, transparent) 15px, transparent 16px) 0 0 / 34px 30px; opacity: .07; }
.circuit { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px); overflow: visible; pointer-events: none; z-index: 3; }
.circuit path { fill: none; stroke: url(#cg); stroke-width: 2; filter: drop-shadow(0 0 6px var(--b)); }
.circuit .trace { stroke-width: 1; opacity: .55; }
.c { position: absolute; opacity: 0; z-index: 4; }
.hdr { left: 24px; right: 24px; top: 0; height: 64px; display: flex; align-items: center; gap: 14px; }
.hdr .av { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--a); display: grid; place-items: center; font: 900 13px Orbitron; color: var(--a); box-shadow: 0 0 12px color-mix(in srgb, var(--a) 50%, transparent); }
.hdr .ttl { font: 700 16px Orbitron; letter-spacing: .14em; white-space: nowrap; }
.hdr .ttl span { color: var(--a); }
.hdr .sub { font: 500 11px 'JetBrains Mono'; color: #8d90b3; }
.search { margin-left: auto; width: 300px; height: 36px; border: 1px solid #3a3950; background: #0b0a12; display: flex; align-items: center; gap: 8px; padding: 0 12px; font: 400 13px 'JetBrains Mono'; color: #8d90b3;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.search i { color: var(--a); }
.search input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: #e9ecff; font: 400 13px 'JetBrains Mono'; }
.search input::placeholder { color: #8d90b3; }
.side { left: 18px; top: 86px; width: 186px; display: flex; flex-direction: column; gap: 4px; }
.h4 { font: 700 12px Rajdhani; letter-spacing: .22em; color: var(--b); margin-bottom: 4px; }
.side a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font: 600 15px Rajdhani; color: #dfe3ff; text-decoration: none; border-left: 2px solid transparent; transition: all .15s; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side a:hover { border-color: var(--a); background: color-mix(in srgb, var(--a) 10%, transparent); padding-left: 14px; }
.side .acts { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.side .acts span { font: 700 11px Rajdhani; letter-spacing: .1em; text-align: center; padding: 7px; border: 1px solid #34334a; color: #aab0d6; cursor: pointer; transition: all .15s; }
.side .acts span:hover { color: var(--b); border-color: var(--b); box-shadow: 0 0 10px color-mix(in srgb, var(--b) 40%, transparent); }
.grid { left: 238px; top: 86px; width: 520px; }
.gh { display: flex; justify-content: space-between; align-items: baseline; }
.allb { font: 700 11px Rajdhani; letter-spacing: .18em; color: var(--a); cursor: pointer; pointer-events: auto; }
.allb:hover { color: #fff; text-shadow: 0 0 8px var(--a); }
.allapps { position: absolute; left: 0; top: 26px; width: 520px; height: 172px; overflow-y: auto; display: none; grid-template-columns: repeat(3, 1fr); grid-auto-rows: max-content; gap: 1px 6px; align-content: start; padding-right: 4px; z-index: 31; pointer-events: auto; }
.allapps::-webkit-scrollbar { width: 4px; } .allapps::-webkit-scrollbar-thumb { background: var(--a); }
.allapps .L { grid-column: 1 / -1; font: 700 11px Rajdhani; letter-spacing: .22em; color: var(--a); border-bottom: 1px solid color-mix(in srgb, var(--a) 40%, transparent); padding: 4px 2px 1px; }
.allapps .a { display: flex; align-items: center; gap: 7px; padding: 4px 6px; font: 600 13px Rajdhani; color: #e9ecff; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
.allapps .a img { width: 16px; height: 16px; flex: none; }
.allapps .a:hover { border-color: var(--b); background: color-mix(in srgb, var(--b) 10%, transparent); }
.results { position: absolute; left: 0; top: 26px; width: 520px; max-height: 172px; overflow: hidden; display: none; flex-direction: column; gap: 2px; }
.results div { display: flex; align-items: center; gap: 10px; padding: 6px 10px; font: 600 14px Rajdhani; cursor: pointer; border-left: 2px solid transparent; }
.results div img { width: 20px; height: 20px; }
.results div:first-child, .results div:hover { border-color: var(--b); background: color-mix(in srgb, var(--b) 10%, transparent); }
.sys { left: 238px; top: 290px; width: 250px; }
.meter { display: grid; grid-template-columns: 34px 1fr 54px; align-items: center; gap: 8px; font: 600 12px 'JetBrains Mono'; color: #aab0d6; margin: 7px 0; }
.meter b { height: 6px; background: #1a1926; position: relative; overflow: hidden; }
.meter b i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, var(--a), var(--b)); box-shadow: 0 0 8px var(--b); transition: width .6s; }
.recent { left: 508px; top: 290px; width: 250px; }
.recent #recent > div { display: flex; align-items: center; gap: 8px; font: 600 13px Rajdhani; color: #cfd3ff; padding: 5px 0; border-bottom: 1px solid #22212e; cursor: pointer; white-space: nowrap; overflow: hidden; }
.recent #recent > div span { overflow: hidden; text-overflow: ellipsis; }
.recent #recent > div:hover { color: var(--b); }
.recent #recent > div i { color: var(--a); }
.recent #recent > div small { margin-left: auto; font: 500 11px 'JetBrains Mono'; color: #7d80a3; }
.power { right: 22px; bottom: 16px; display: flex; gap: 10px; font-size: 20px; color: #aab0d6; }
.power i { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid #3a3950; border-radius: 50%; cursor: pointer; transition: all .15s; position: relative; }
.power i:hover { color: var(--b); border-color: var(--b); }
.power i:first-child { color: var(--a); border-color: var(--a); box-shadow: 0 0 10px color-mix(in srgb, var(--a) 60%, transparent); }
.power i.armed { background: var(--a); color: #000; animation: blink 0.5s steps(1) infinite; }
@keyframes blink { 50% { opacity: .5; } }
.sweep { position: absolute; left: 0; right: 0; height: 40px; z-index: 5; pointer-events: none; opacity: 0; background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--b) 25%, transparent), transparent); }

.tile { position: absolute; width: 60px; height: 60px; display: grid; place-items: center; z-index: 30; cursor: pointer;
  background: linear-gradient(160deg, #23222f, #12111a); border: 1px solid #3a3950; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); pointer-events: none; }
.tile img { width: 28px; height: 28px; margin-bottom: 10px; transition: transform .22s cubic-bezier(.2, 1.6, .4, 1); }
.tile:hover img { transform: scale(1.3); } .tile:active img { transform: scale(1.08); transition-duration: .08s; }
.tile.live { pointer-events: auto; }
.tile.live:hover { border-color: var(--b); filter: drop-shadow(0 0 8px var(--b)); }
.tile em { position: absolute; bottom: 3px; left: 4px; right: 4px; text-align: center; font: 700 10px Rajdhani; font-style: normal; letter-spacing: .08em; color: #9aa0c8; opacity: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spark { position: absolute; width: 3px; height: 3px; background: #fff; box-shadow: 0 0 6px 2px var(--a); border-radius: 50%; z-index: 50; pointer-events: none; }
.ring { position: absolute; border: 2px solid var(--b); border-radius: 50%; z-index: 45; pointer-events: none; box-shadow: 0 0 20px var(--b), inset 0 0 20px var(--b); }
.flash { position: absolute; inset: 0; background: radial-gradient(50% 45% at 50% 85%, color-mix(in srgb, var(--b) 35%, transparent), transparent 70%); opacity: 0; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="flash" id="flash"></div>
  <div class="menu" id="menu">
    <div class="shard" data-k="tl" style="left:0;top:0;width:386px;height:64px;clip-path:polygon(20px 0,100% 0,100% 100%,0 100%,0 20px)"></div>
    <div class="shard" data-k="tr" style="left:392px;top:0;width:388px;height:64px"></div>
    <div class="shard" data-k="l" style="left:0;top:70px;width:218px;height:400px;clip-path:polygon(0 0,100% 0,100% 100%,20px 100%,0 calc(100% - 20px))"></div>
    <div class="shard" data-k="ru" style="left:224px;top:70px;width:556px;height:200px"></div>
    <div class="shard" data-k="rd" style="left:224px;top:276px;width:556px;height:194px;clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%)"></div>
    <svg class="circuit" id="circuit" viewBox="-2 -2 784 474">
      <defs><linearGradient id="cg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--a)"/><stop offset="1" style="stop-color:var(--b)"/></linearGradient></defs>
      <path d="M20 0 H780 V450 L760 470 H20 L0 450 V20 Z"/>
      <path class="trace" d="M224 70 V470 M0 67 H780 M224 273 H780 M496 290 V454"/>
    </svg>
    <div class="sweep" id="sweep"></div>
    <div class="c hdr"><div class="av" id="av">SJ</div><div><div class="ttl" id="ttl" data-text="SHARMAJI // COMMAND CENTER">SHARMAJI <span>//</span> COMMAND CENTER</div><div class="sub" id="sub" data-text="root">root</div></div>
      <label class="search"><i class="ti ti-terminal-2"></i><input id="q" placeholder="run anything" spellcheck="false" autocomplete="off"></label></div>
    <div class="c side" id="side">
      <div class="h4" data-text="PROJECTS">PROJECTS</div>
      <div id="projects"></div>
      <div class="acts"><span data-sys="lock">LOCK</span><span data-sys="explorer">EXPLORER</span><span data-sys="themer">THEMER</span><span data-sys="settings">SETTINGS</span></div>
    </div>
    <div class="c grid"><div class="gh"><div class="h4" id="gridTitle" data-text="PINNED">PINNED</div><a class="allb" id="allBtn">ALL APPS ▸</a></div><div class="results" id="results"></div><div class="allapps" id="allapps"></div></div>
    <div class="c sys"><div class="h4" data-text="SYSTEM">SYSTEM</div>
      <div class="meter">CPU<b><i data-m="cpu"></i></b><span data-v="cpu">0%</span></div>
      <div class="meter">RAM<b><i data-m="ram"></i></b><span data-v="ram">0%</span></div>
      <div class="meter" id="gpuRow">GPU<b><i data-m="gpu"></i></b><span data-v="gpu">0%</span></div>
      <div class="meter">NET<b><i data-m="net"></i></b><span data-v="net">0</span></div>
    </div>
    <div class="c recent"><div class="h4" data-text="RECENT">RECENT</div><div id="recent"></div></div>
    <div class="c power"><i class="ti ti-power" data-pw="shutdown"></i><i class="ti ti-refresh" data-pw="restart"></i><i class="ti ti-moon" data-pw="sleep"></i></div>
  </div>
  <div class="piston" id="pL"><i></i><i></i><i></i></div>
  <div class="piston" id="pR"><i></i><i></i><i></i></div>

  <div class="rail" id="rail"></div>
  <div class="beam" id="beamL"></div><div class="beam" id="beamR"></div>
  <div class="bar" id="bar">
    <div class="edge gear" id="gear" data-tip="TRANSCRYPTO Themer"><i class="ti ti-settings"></i></div>
    <div class="plate start" id="start"><div class="orb" id="orb"><span class="r1"></span><span class="r2"></span><b id="orbTxt">SJ</b></div><span class="bolt r"></span><span class="bolt l"></span></div>
    <div id="apps" style="display:contents"></div>
    <div class="plate tray"><i class="ti ti-chevron-up" data-tip="hidden icons" data-sys="tray"></i><i class="ti ti-wifi" id="tNet" data-sys="quick"></i><i class="ti ti-volume" id="tVol" data-sys="quick"></i><i class="ti ti-battery-3" id="tBat" data-sys="quick"></i><span class="bolt r"></span><span class="bolt l"></span></div>
    <div class="plate clock" id="clock" data-sys="notify"><span id="t">--:--</span><small id="d"></small><i class="tri"></i><span class="bolt r"></span><span class="bolt l"></span></div>
    <div class="edge quit" id="quit" data-tip="exit TRANSCRYPTO"><i class="ti ti-x"></i></div>
  </div>
</div>

<script src="shell.js"></script>
<script>
// badge + title: fixed for TRANSCRYPTO / Alien; the default palette shows the signed-in user (null = from the user)
const P = { sharmaji: ['#ff8a00', '#00e5ff', '#ffd166', null, null], transcrypto: ['#00f0ff', '#ff2bd6', '#b388ff', 'TC', 'TRANSCRYPTO'], alien: ['#39ff14', '#7a5cff', '#c6ff00', 'A', 'ALIEN'] };
const stage = $('#stage'), menu = $('#menu'), bar = $('#bar');
let open = false, busy = false, speed = 1, tiles = [], sfx = Q.get('sfx') !== '0', apps = [], appsSig = '';

/* ---------- palette */
(function palette() {
  const p = P[Shell.palette] || P.sharmaji, s = document.documentElement.style;
  s.setProperty('--a', p[0]); s.setProperty('--b', p[1]); s.setProperty('--k', p[2]);
  const badge = (b, t) => { $('#orbTxt').textContent = b; $('#av').textContent = b; $('#ttl').dataset.text = `${t} // COMMAND CENTER`; $('#ttl').innerHTML = `${Shell.esc(t)} <span>//</span> COMMAND CENTER`; };
  if (p[3]) { badge(p[3], p[4]); return; }
  badge('TC', 'TRANSCRYPTO');   // until the engine says who is signed in
  let who = '';
  Shell.on((st) => { const u = (st.sys && st.sys.user) || ''; if (!u || u === who) return; who = u; badge(Shell.initials(u), u.toUpperCase().slice(0, 18)); });
})();

Shell.layoutStage(stage); Shell.backdrop();

/* ---------- region + reserve: the rail (plus a tooltip when one is showing) */
Shell.refreshRegion = () => { if (!open) Shell.region([$('#rail'), Shell.tip.el && Shell.tip.el.style.display === 'block' ? Shell.tip.el : null]); };
function relayout() {
  $('#rail').style.width = bar.offsetWidth + 40 + 'px';
  Shell.metrics($('#rail').getBoundingClientRect().top);
  Shell.refreshRegion();
}

/* ---------- taskbar apps from the engine */
function renderApps(list) {
  apps = list.slice(0, 24);   // the bar grows with the running apps
  const box = $('#apps'); box.innerHTML = '';
  apps.forEach((a, i) => {
    const p = document.createElement('div'); p.className = 'plate app' + (a.running ? ' run' : '') + (a.active ? ' act' : '');
    p.innerHTML = `<img src="${Shell.icon(a.icon, 64)}" alt=""><span class="bolt r"></span><span class="bolt l"></span>`;
    p.onmouseenter = () => { if (!busy) { Shell.tip.show(p, (a.title || a.name).toUpperCase().slice(0, 40)); tick(1800, .02); } };
    p.onmouseleave = () => Shell.tip.hide();
    p.onclick = (e) => { Shell.tip.hide(); Shell.launchApp(a, e.shiftKey); };
    p.onauxclick = (e) => { if (e.button === 1) Shell.launchApp(a, true); };
    p._app = a; box.append(p);
  });
  relayout();
}
Shell.enableAppDrag(() => $$('#apps .plate.app'));
function trayUpdate(s) {
  $('#tNet').className = 'ti ' + Shell.netIcon(s); $('#tVol').className = 'ti ' + Shell.volIcon(s);
  const b = Shell.batIcon(s); $('#tBat').style.display = b ? '' : 'none'; if (b) $('#tBat').className = 'ti ' + b;
  const t = Shell.time(); $('#t').textContent = `${t.hh}:${t.mm}`; $('#d').textContent = t.d.toDateString().slice(4, 10).toUpperCase();
}
Shell.on((st) => {
  const sig = Shell.appsSig(st.apps);
  if (sig !== appsSig && !open && !busy) { appsSig = sig; renderApps(st.apps); }
  trayUpdate(st.sys);
  if (open) meters(st.sys);
});
$$('[data-sys]').forEach((el) => el.addEventListener('click', (e) => { e.stopPropagation(); Shell.sys(el.dataset.sys); if (open && el.closest('.menu')) fold(); }));
$$('[data-tip]').forEach((el) => { el.addEventListener('mouseenter', () => Shell.tip.show(el, el.dataset.tip.toUpperCase())); el.addEventListener('mouseleave', () => Shell.tip.hide()); });
$('#tVol').addEventListener('wheel', (e) => { e.preventDefault(); Shell.volume(e.deltaY < 0 ? 4 : -4); }, { passive: false });
$('#tVol').addEventListener('contextmenu', (e) => { e.preventDefault(); Shell.volume('mute'); });

/* ---------- synthesized sound */
function tone(type, f0, f1, dur, vol, lp = 2200) {
  if (!sfx) return; const c = Shell.ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); f.type = 'lowpass'; f.frequency.value = lp;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(f).connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, vol, freq) {
  if (!sfx) return; const c = Shell.ac(), t = c.currentTime, b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(c.destination); s.start(t);
}
const servo = (up = true) => tone('sawtooth', up ? 140 : 520, up ? 560 : 120, .42 * speed, .045, 1500);
const clack = () => noise(.06, .5, 2600);
const thunk = () => { tone('sine', 140, 40, .3, .35); noise(.08, .25, 400); };
const zap = () => tone('square', 900, 2600, .12, .025, 4000);
const tick = (f, v) => tone('triangle', f, f * 1.02, .05, v, 5000);

/* ---------- helpers */
const rel = (el) => { const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = Shell.K || 1; return { x: (r.left - s.left) / k, y: (r.top - s.top) / k, w: r.width / k, h: r.height / k }; };
const anim = (el, kf, o) => el.animate(kf, Object.assign({ fill: 'both', easing: 'cubic-bezier(.2,.8,.2,1)' }, o, { duration: o.duration * speed, delay: (o.delay || 0) * speed })).finished.catch(() => {});
const wait = (ms) => new Promise((r) => setTimeout(r, ms * speed));
const later = (ms, fn) => setTimeout(fn, ms * speed);
function sparks(x, y, n = 14, up = 30) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'spark'; s.style.left = x + 'px'; s.style.top = y + 'px'; stage.append(s);
    const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 80;
    anim(s, [{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d - up}px)`, opacity: 0 }], { duration: 450 + Math.random() * 350 }).then(() => s.remove());
  }
}
function shock(x, y, size = 900) {
  const r = document.createElement('div'); r.className = 'ring'; r.style.left = x - 10 + 'px'; r.style.top = y - 10 + 'px'; r.style.width = r.style.height = '20px'; stage.append(r);
  anim(r, [{ transform: 'scale(1)', opacity: .9 }, { transform: `scale(${size / 20})`, opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.1,.6,.3,1)' }).then(() => r.remove());
}
function decode(el, dur) {
  const fin = el.dataset.text, chars = '!<>-_\\/[]{}=+*^?#01ABCDEF', t0 = performance.now();
  (function f(now) { const p = Math.min(1, (now - t0) / (dur * speed)), n = Math.floor(fin.length * p);
    el.textContent = fin.slice(0, n) + [...fin.slice(n)].map((c) => c === ' ' ? ' ' : chars[Math.random() * chars.length | 0]).join('');
    if (p < 1) requestAnimationFrame(f); else if (el.id === 'ttl') el.innerHTML = fin.replace('//', '<span>//</span>'); })(t0);
}
function meters(s) {
  const gpu = s.gpu >= 0, v = { cpu: s.cpu, ram: s.ram, gpu: gpu ? s.gpu : s.disk, net: Math.min(100, s.down / 131072 * 10) };
  $('#gpuRow').firstChild.textContent = gpu ? 'GPU' : 'DSK';
  for (const k in v) { $(`[data-m="${k}"]`).style.width = Math.max(2, v[k]) + '%'; $(`[data-v="${k}"]`).textContent = k === 'net' ? Shell.rate(s.down) : Math.round(v[k]) + '%'; }
}

/* ---------- menu content from the engine */
function fillMenu() {
  const st = Shell.start || {}, sys = (Shell.state && Shell.state.sys) || {};
  $('#sub').dataset.text = `${(sys.user || 'root').toLowerCase()}@${location.hostname === '127.0.0.1' ? 'this-pc' : location.hostname}  ·  ${apps.filter((a) => a.running).length} apps running`;
  $('#projects').innerHTML = Shell.projects().map((p, i) => `<a data-open="${Shell.esc(p.path)}"><i class="ti ti-${['palette', 'topology-star-3', 'sparkles', 'bolt', 'device-tv'][i % 5]}"></i><span data-text="${Shell.esc(p.name)}">${Shell.esc(p.name)}</span></a>`).join('');
  $('#recent').innerHTML = (st.recentFiles || []).slice(0, 4).map((f) => `<div data-open="${Shell.esc(f.path)}"><i class="ti ti-file"></i><span>${Shell.esc(f.name)}</span><small>${Shell.ago(f.when)}</small></div>`).join('');
  $$('[data-open]', menu).forEach((el) => el.onclick = () => Shell.open$(el.dataset.open));
}
/* All Apps: every Start menu app, A-Z, in place of the pinned tiles */
let allOn = false;
function showAll(on) {
  allOn = on; $('#allBtn').textContent = on ? '◂ PINNED' : 'ALL APPS ▸';
  $('#allapps').style.display = on ? 'grid' : 'none'; $('#results').style.display = 'none';
  tiles.forEach((t) => t.style.visibility = on ? 'hidden' : '');
  const apps = ((Shell.start && Shell.start.apps) || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  $('#gridTitle').textContent = on ? `ALL APPS // ${apps.length}` : 'PINNED';
  if (!on) return;
  let h = '', last = '';
  for (const a of apps) { const c = /[a-z]/i.test(a.name[0]) ? a.name[0].toUpperCase() : '#'; if (c !== last) { h += `<div class="L">${c}</div>`; last = c; }
    h += `<div class="a" data-p="${Shell.esc(a.path)}" title="${Shell.esc(a.name)}"><img src="${Shell.icon(a.icon, 32)}" alt="" loading="lazy">${Shell.esc(a.name)}</div>`; }
  $('#allapps').innerHTML = h; $('#allapps').scrollTop = 0;
  $$('#allapps .a').forEach((d) => d.onclick = () => Shell.open$(d.dataset.p));
}
$('#allBtn').onclick = (e) => { e.stopPropagation(); if ($('#q').value) $('#q').value = ''; showAll(!allOn); };
$('#q').addEventListener('input', () => {
  if (allOn) showAll(false);
  const res = Shell.search($('#q').value), box = $('#results'), has = $('#q').value.trim() !== '';
  box.style.display = has ? 'flex' : 'none'; tiles.forEach((t) => t.style.visibility = has ? 'hidden' : '');
  $('#gridTitle').textContent = has ? `RESULTS // ${res.length}` : 'PINNED';
  box.innerHTML = res.map((a) => `<div data-p="${Shell.esc(a.path)}"><img src="${Shell.icon(a.icon, 32)}" alt="">${Shell.esc(a.name)}</div>`).join('');
  $$('div', box).forEach((d) => d.onclick = () => Shell.open$(d.dataset.p));
});
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const f = $('#results div'); if (f) f.click(); } });
$$('[data-pw]').forEach((el) => el.onclick = () => Shell.power(el.dataset.pw, el));
$('#gear').onclick = (e) => { e.stopPropagation(); Shell.sys('themer'); };
$('#quit').onclick = async (e) => { e.stopPropagation(); const r = await Shell.power('exit', $('#quit')); if (r === 'armed') Shell.tip.show($('#quit'), 'CLICK AGAIN TO EXIT'); };

stage.addEventListener('mousemove', (e) => { if (!open || busy) return; const r = stage.getBoundingClientRect(), nx = (e.clientX - r.left) / r.width - .5, ny = (e.clientY - r.top) / r.height - .5;
  menu.style.transform = `rotateY(${nx * 6}deg) rotateX(${-ny * 5}deg)`; });
document.addEventListener('mousedown', (e) => { if (open && !busy && !e.target.closest('.menu, .tile, .bar, .rail, .tcCtx')) fold(); });

/* ---------- the transformation */
async function transform() {
  busy = true; Shell.busy = true; Shell.tip.hide();
  await Promise.all([Shell.act('menu', { open: 1 }), Shell.loadStart()]);
  await Shell.useScreenshot(true);
  Shell.ac().resume?.(); fillMenu(); $('#q').value = ''; showAll(false); $('#results').style.display = 'none'; $('#gridTitle').textContent = 'PINNED';
  const orb = $('#orb'), start = $('#start'), sr = rel(start), br = rel(bar), mr = rel(menu), plates = $$('.plate.app', bar).slice(0, 12);
  const ox = sr.x + sr.w / 2, oy = sr.y + sr.h / 2;
  orb.classList.add('charge'); tone('sawtooth', 80, 900, .55 * speed, .035, 900);
  [$('#beamL'), $('#beamR')].forEach((b, i) => { b.style.top = br.y - 2 + 'px'; b.style.width = '140px';
    anim(b, [{ left: ox + 'px', opacity: 1 }, { left: (i ? br.x + br.w : br.x - 140) + 'px', opacity: 0 }], { duration: 480, easing: 'cubic-bezier(.6,0,.4,1)' }); });
  await wait(380);
  $$('.plate', bar).forEach((p, i) => { anim(p, [{ transform: 'none' }, { transform: 'translateY(-12px) rotateX(32deg)' }, { transform: 'translateY(-4px) rotateX(12deg)' }], { duration: 260, delay: i * 22 }); later(i * 22, () => tick(2400 - i * 90, .04)); });
  await wait(300); clack(); sparks(sr.x + sr.w, oy, 12);
  const pl = $('#pL'), pr = $('#pR'), py = mr.y + mr.h;
  [[pl, mr.x + 120], [pr, mr.x + mr.w - 136]].forEach(([p, x]) => { p.style.left = x + 'px'; p.style.top = py + 'px'; p.style.height = (br.y - py) + 'px';
    anim(p, [{ opacity: 0, transform: 'scaleY(0)', transformOrigin: 'bottom' }, { opacity: 1, transform: 'scaleY(1.15)', offset: .7 }, { opacity: 1, transform: 'scaleY(1)' }], { duration: 380 }); });
  servo(true);
  // the grid shows the real Start menu pins: bar plates fly up and flip into them; any extra pins spin out of the orb
  const cols = 8, gx = mr.x + 238, gy = mr.y + 100, TS = 60, pins = ((Shell.start && Shell.start.pins) || []).slice(0, 16);
  tiles = pins.map((pin, i) => {
    const p = plates[i], r = p ? rel(p) : { x: ox - 22, y: oy - 22, w: 44, h: 44 }, t = document.createElement('div');
    t.className = 'tile'; t.innerHTML = `<img src="${p ? p.querySelector('img').src : Shell.icon(pin.icon, 64)}" alt=""><em>${Shell.esc(pin.name.toUpperCase())}</em>`;
    Object.assign(t.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' }); stage.append(t); if (p) p.style.visibility = 'hidden';
    t._to = { x: gx + (i % cols) * (TS + 5) - r.x, y: gy + Math.floor(i / cols) * (TS + 26) - r.y }; t._w = r.w; t._h = r.h; t._p = p;
    t.dataset.p = pin.path; t.onclick = () => Shell.open$(pin.path);
    const d = 220 + i * 50;
    later(d + 900 * .5, () => { t.querySelector('img').src = Shell.icon(pin.icon, 64); });   // swap to the pin while it is edge-on
    anim(t, [
      { transform: `translate(0,0) rotateX(0) rotateZ(0) scale(${p ? 1 : 0})`, width: r.w + 'px', height: r.h + 'px' },
      { transform: `translate(${t._to.x * .4}px, ${t._to.y * .55 - 90}px) rotateX(200deg) rotateZ(${i % 2 ? 30 : -30}deg) scale(1.15)`, offset: .55 },
      { transform: `translate(${t._to.x}px, ${t._to.y + 8}px) rotateX(350deg) rotateZ(0) scale(.96)`, offset: .9 },
      { transform: `translate(${t._to.x}px, ${t._to.y}px) rotateX(360deg) rotateZ(0) scale(1)`, width: TS + 'px', height: TS + 'px' }
    ], { duration: 900, delay: d, easing: 'cubic-bezier(.5,0,.2,1)' });
    later(d + 820, () => tick(1200 + i * 60, .05));
    return t;
  });
  plates.slice(pins.length).forEach((p) => anim(p, [{ opacity: 1 }, { opacity: 0 }], { duration: 300 }));
  ['l', 'tl', 'ru', 'tr', 'rd'].forEach((k, i) => {
    const s = $(`.shard[data-k="${k}"]`), x = s.offsetLeft + s.offsetWidth / 2, y = s.offsetTop + s.offsetHeight / 2, dx = ox - (mr.x + x), dy = oy - (mr.y + y);
    const rx = (i % 2 ? 1 : -1) * (70 + i * 20), ry = (i % 2 ? -1 : 1) * (110 - i * 15);
    anim(s, [
      { opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(.04) rotateX(${rx}deg) rotateY(${ry}deg)` },
      { opacity: 1, transform: `translate(${dx * .25}px, ${dy * .2 - 30}px) scale(.7) rotateX(${rx * .3}deg) rotateY(${ry * .3}deg)`, offset: .5 },
      { opacity: 1, transform: `translate(0, -6px) scale(1.03) rotateX(${-rx * .04}deg)`, offset: .82 },
      { opacity: 1, transform: 'none' }
    ], { duration: 760, delay: 320 + i * 110, easing: 'cubic-bezier(.45,0,.2,1)' });
    later(320 + i * 110 + 620, () => { clack(); sparks(mr.x + x, mr.y + y, 6, 10); });
  });
  anim(start, [{ transform: 'none' }, { transform: 'translateY(-30px) scale(1.3)', offset: .4 }, { transform: 'translateY(-4px)' }], { duration: 800, delay: 180 });
  await wait(1350);
  thunk(); shock(ox, oy); orb.classList.remove('charge');
  anim($('#flash'), [{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 480 });
  sparks(mr.x + 20, mr.y + 64, 18); sparks(mr.x + mr.w - 20, mr.y + mr.h, 18);
  $$('#circuit path').forEach((p, i) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; anim(p, [{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 650, delay: i * 120, easing: 'cubic-bezier(.6,0,.2,1)' }); });
  zap(); later(160, zap);
  anim($('#sweep'), [{ top: '-40px', opacity: 1 }, { top: '480px', opacity: 1 }, { top: '480px', opacity: 0 }], { duration: 700, delay: 150 });
  $$('.c', menu).forEach((c, i) => anim(c, [{ opacity: 0, transform: 'translateY(8px)', filter: 'blur(5px)' }, { opacity: 1, transform: 'none', filter: 'none' }], { duration: 320, delay: 200 + i * 70 }));
  later(240, () => $$('[data-text]', menu).forEach((el, i) => later(i * 25, () => decode(el, 380))));
  if (Shell.state) later(420, () => meters(Shell.state.sys));
  tiles.forEach((t, i) => { anim(t.querySelector('em'), [{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: 380 + i * 30 }); });
  await Promise.all($$('.plate:not(.app)', bar).map((p) => anim(p, [{ transform: 'translateY(-4px) rotateX(12deg)' }, { transform: 'none' }], { duration: 240, delay: 120 })));
  $$('.plate', bar).forEach((p) => p.getAnimations().forEach((a) => a.cancel()));
  tiles.forEach((t) => t.classList.add('live'));
  // like a real taskbar, the running apps stay on the bar while the menu is open: the plates that became tiles are re-pressed
  $$('.plate.app', bar).forEach((p, i) => { p.style.visibility = ''; anim(p, [{ opacity: 0, transform: 'scaleY(0)', transformOrigin: 'bottom' }, { opacity: 1, transform: 'scaleY(1.12)', offset: .7 }, { opacity: 1, transform: 'none' }], { duration: 320, delay: i * 25 }); });
  menu.classList.add('live'); open = true; Shell.open = true; busy = false; Shell.busy = false;
  setTimeout(() => $('#q').focus(), 50);
}

async function fold() {
  if (!open || busy) return;
  busy = true; Shell.busy = true; menu.classList.remove('live'); menu.style.transform = ''; $('#q').blur();
  const start = $('#start'), sr = rel(start), mr = rel(menu), ox = sr.x + sr.w / 2, oy = sr.y + sr.h / 2;
  if (allOn) showAll(false);
  tiles.forEach((t, i) => { t.classList.remove('live'); t.style.visibility = '';
    anim(t, [{ transform: `translate(${t._to.x}px, ${t._to.y}px) scale(1)`, opacity: 1 }, { transform: `translate(${t._to.x}px, ${t._to.y}px) scale(0)`, opacity: 0 }], { duration: 220, delay: i * 8, easing: 'cubic-bezier(.5,0,.9,.5)' }); });
  tone('sawtooth', 700, 90, .5 * speed, .035, 1200);
  await wait(200);
  $$('[data-text]', menu).forEach((el) => { const fin = el.dataset.text; el.dataset.text = fin.replace(/[^ ]/g, '#'); decode(el, 160); el.dataset.text = fin; });
  $$('.c', menu).forEach((c, i) => anim(c, [{ opacity: 1 }, { opacity: 0, filter: 'blur(4px)' }], { duration: 220, delay: i * 30 }));
  $$('#circuit path').forEach((p) => { const L = p.getTotalLength(); anim(p, [{ strokeDashoffset: 0 }, { strokeDashoffset: -L }], { duration: 380 }); });
  await wait(220);
  ['rd', 'tr', 'ru', 'tl', 'l'].forEach((k, i) => {
    const s = $(`.shard[data-k="${k}"]`), x = s.offsetLeft + s.offsetWidth / 2, y = s.offsetTop + s.offsetHeight / 2;
    anim(s, [{ opacity: 1, transform: 'none' }, { opacity: 1, transform: 'translateY(-10px) scale(1.02)', offset: .2 },
      { opacity: 0, transform: `translate(${ox - (mr.x + x)}px, ${oy - (mr.y + y)}px) scale(.04) rotateX(${i % 2 ? 90 : -90}deg) rotateY(${i % 2 ? -120 : 120}deg)` }],
      { duration: 560, delay: i * 70, easing: 'cubic-bezier(.6,0,.8,.3)' });
    later(i * 70 + 80, () => tick(900 - i * 90, .04));
  });
  await wait(560);
  tiles.forEach((t) => { if (t._p) t._p.style.visibility = ''; t.remove(); }); tiles = [];
  $$('.plate.app', bar).forEach((p) => { p.getAnimations().forEach((a) => a.cancel()); p.style.visibility = ''; });
  [$('#pL'), $('#pR')].forEach((p) => anim(p, [{ opacity: 1, transform: 'scaleY(1)', transformOrigin: 'bottom' }, { opacity: 0, transform: 'scaleY(0)' }], { duration: 260 }));
  thunk(); sparks(ox + 40, oy - 20, 12);
  await Promise.all($$('.plate', bar).map((p, i) => anim(p, [{ transform: 'translateY(-8px) rotateX(18deg)' }, { transform: 'none' }], { duration: 260, delay: i * 16 })));
  stage.getAnimations({ subtree: true }).forEach((a) => { if (!(a instanceof CSSAnimation)) a.cancel(); });
  $$('#circuit path').forEach((p) => { p.style.strokeDasharray = p.getTotalLength(); p.style.strokeDashoffset = p.getTotalLength(); });
  open = false; Shell.open = false;
  await Shell.useScreenshot(false);
  await Shell.act('menu', { open: 0 });
  busy = false; Shell.busy = false;
  if (Shell.state) { appsSig = ''; renderApps(Shell.state.apps); appsSig = Shell.appsSig(Shell.state.apps); }
  Shell.refreshRegion(); Shell.scheduleHide(1200);
}

$$('#circuit path').forEach((p) => { p.style.strokeDasharray = p.getTotalLength(); p.style.strokeDashoffset = p.getTotalLength(); });
$('#start').onclick = () => { if (busy) return; open ? fold() : transform(); };
Shell.onStart = () => { if (busy) return; open ? fold() : transform(); };
Shell.onEscape = () => fold(); Shell.close = () => fold();
Shell.onBlur = () => fold();
Shell.poll(); Shell.loadStart();   // preload Start pins and apps (the first read takes a moment)
setInterval(() => { if (!open && !Shell.hidden) relayout(); }, 5000);
setTimeout(() => Shell.setupAutohide(stage), 1200);
</script>
</body>
